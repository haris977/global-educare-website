# .github/workflows/ci.yml
name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        project-dir: [website, admin, backend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm  # enables caching of node_modules :contentReference[oaicite:0]{index=0}

      - name: Install & Build ${{ matrix.project-dir }}
        working-directory: ${{ matrix.project-dir }}  # point into each sub-folder :contentReference[oaicite:1]{index=1}
        run: |
          npm ci
          npm run build --if-present
