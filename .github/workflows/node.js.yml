name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    defaults:
      run:
        # Apply this working-directory to all `run:` steps
        working-directory: ${{ matrix.project.path }}

    steps:
      # 1) Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Set up Node.js with npm cache
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 3) Build each sub-project
      - name: Install & Build website
        # override the project.path for this step
        env:
          PROJECT_PATH: website
        run: |
          npm ci
          npm run build
          defaults:
            run:
            working-directory: website

      - name: Install & Build admin
        env:
          PROJECT_PATH: admin
        run: |
          npm ci
          npm run build
          defaults:
          run:
            working-directory: admin

      - name: Install & Build backend
        env:
          PROJECT_PATH: backend
        run: |
          npm ci
          npm run build
          defaults:
            run:
              working-directory: backend
