# .github/workflows/ci.yml
name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        project-dir: [website, admin, backend]

    defaults:
      run:
        working-directory: ${{ matrix.project-dir }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            website/package-lock.json
            admin/package-lock.json
            backend/package-lock.json  # ensure setup-node sees each lockfile :contentReference[oaicite:0]{index=0}

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-npm-${{ matrix.project-dir }}-${{ hashFiles(matrix.project-dir + '/package-lock.json') }}  
          restore-keys: |
            ${{ runner.os }}-npm-${{ matrix.project-dir }}-  

      - name: Cache Next.js build cache (if any)
        if: ${{ matrix.project-dir != 'backend' }}
        uses: actions/cache@v3
        with:
          path: ${{ matrix.project-dir }}/.next/cache
          key: ${{ runner.os }}-next-cache-${{ matrix.project-dir }}-${{ hashFiles(matrix.project-dir + '/next.config.js', matrix.project-dir + '/package.json') }}  
        # Next.js stores build artifacts in .next/cache; caching speeds up incremental builds :contentReference[oaicite:1]{index=1}

      - name: Install & build
        run: |
          npm ci
          npm run build --if-present
