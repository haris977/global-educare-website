name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      # Checkout the repo
      - uses: actions/checkout@v4

      # Setup Node.js
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Loop through each project folder to install and build
      - name: Install and build projects
        run: |
          for dir in admin backend website; do
            echo "\n➡️ Processing $dir..."
            cd $dir
            echo "⬇️ Installing dependencies in $dir"
            npm ci
            echo "🔨 Building $dir"
            npm run build --if-present
            cd ..
          done
