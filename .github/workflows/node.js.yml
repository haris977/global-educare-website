# .github/workflows/ci.yml
name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node version matrix
        node-version: [22.x]
        # Loop over each sub-project
        project-dir: [website, admin, backend]

    # Run commands in each subfolder automatically
    defaults:
      run:
        working-directory: ${{ matrix.project-dir }}  # point into website/, admin/, backend/ :contentReference[oaicite:4]{index=4}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'                            # enable npm caching :contentReference[oaicite:5]{index=5}
          cache-dependency-path: |
            **/package-lock.json                  # find all lockfiles in subdirectories :contentReference[oaicite:6]{index=6}

      - name: Install dependencies & build
        run: |
          npm ci                                  # clean install from lockfile
          npm run build --if-present             # build if script exists
